[tool.poetry]
name = "reststudy"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "<6.0"
psycopg2 = "^2.9.11"
pillow = "^12.1.0"
djangorestframework = "^3.16.1"
python-dotenv = "^1.2.1"
flake8 = "^7.3.0"
black = "^25.12.0"
isort = "^7.0.0"
django-filter = "^25.2"
djangorestframework-simplejwt = "^5.5.1"
ipython = "^9.9.0"
coverage = "^7.13.1"
coreapi = "^2.3.3"
drf-yasg = "^1.21.14"
django-cors-headers = "^4.9.0"
requests = "^2.32.5"
stripe = "^14.3.0"
redis = "^7.1.1"
eventlet = "^0.40.4"
celery = "^5.6.2"
celery-types = "^0.24.0"
django-celery-beat = "^2.8.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = '''
    (
    /(
        \.git
    )/
)
'''

[tool.isort]
line_length = 119


[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/management/*",
    "*/site-packages/*",
    "*/config/*",
    "manage.py",
    "settings*.py",
    "*/__init__.py",  # если не хотите покрывать __init__.py
    "scripts/*",        # все скрипты в директории scripts/
]