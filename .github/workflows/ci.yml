name: Django CI

on: [push]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: test-secret-key
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/reststudy:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/reststudy:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/reststudy:${{ github.sha }}"

            docker pull "$IMAGE"

            docker network inspect appnet >/dev/null 2>&1 || docker network create appnet

            # postgres
            if docker ps -aq -f name=^db$ | grep -q .; then
              echo "Postgres already exists"
            else
              docker run -d \
                --name db \
                --network appnet \
                --env-file ~/.env \
                -v postgres_data:/var/lib/postgresql/data \
                postgres:16
            fi

            # redis
            if docker ps -aq -f name=^redis$ | grep -q .; then
              echo "Redis already exists"
            else
              docker run -d \
                --name redis \
                --network appnet \
                redis:7
            fi

            # удаляем старые контейнеры
            for c in myapp celery celery-beat; do
              docker rm -f "$c" 2>/dev/null || true
            done

            # ждём, пока они реально исчезнут
            for c in myapp celery celery-beat; do
              while docker ps -a --format '{{.Names}}' | grep -Fxq "$c"; do
                echo "Waiting for $c to be removed..."
                sleep 1
              done
            done

            # приложение
            docker run -d \
              --name myapp \
              --network appnet \
              --env-file ~/.env \
              -p 80:8000 \
              "$IMAGE"

            # celery worker
            docker run -d \
              --name celery \
              --network appnet \
              --env-file ~/.env \
              "$IMAGE" \
              celery -A config worker -l info

            # celery beat
            docker run -d \
              --name celery-beat \
              --network appnet \
              --env-file ~/.env \
              "$IMAGE" \
              celery -A config beat -l info
          EOF